services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ottodot-app
    restart: unless-stopped
    working_dir: /var/www
    networks:
      - ottodot-network
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-ottodot}
      - DB_USERNAME=${DB_USERNAME:-ottodot}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - APP_KEY=base64:Op+t+YR5jXZlqoN8vFHgK+m4O8QpLw2X3YjV7uT9kKw=

  db:
    image: postgres:16-alpine
    container_name: ottodot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ottodot}
      POSTGRES_USER: ${DB_USERNAME:-ottodot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ottodot-network
    ports:
      - "5432:5432"

  nginx:
    image: nginx:alpine
    container_name: ottodot-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/public
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ottodot-network
    depends_on:
      - app

networks:
  ottodot-network:
    driver: bridge

volumes:
  postgres_data: